<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!--<form action="http://127.0.0.1:5000/processar" method="POST">-->
    <form action="http://127.0.0.1:5000/processar" method="POST">
        <div>
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome_usuario" maxlength="10" placeholder="Digite seu nome completo.">
        </div>

        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email_usuario">
        </div>

        <div>
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha_usuario">
        </div>

        <div>
            <label for="nasc">Data de Nascimento:</label>
            <input type="date" id="nasc" name="data_nasc">
        </div>

        <div>
            <p>Gênero:</p>
            <input type="radio" id="gen_m" name="genero" value="m">
            <label for="gen_m">Masculino</label>

            <input type="radio" id="gen_f" name="genero" value="f">
            <label for="gen_f">Feminino</label>

            <input type="radio" id="gen_o" name="genero" value="o">
            <label for="gen_o">Outro</label>
            <div id="campo_outro_genero" style="display: none; margin-top: 10px;">
                <label for="genero_outro_texto">Especifique:</label>
                <input type="text" id="genero_outro_texto" name="genero_outro_texto">
            </div>
        </div>

        <div>
            <label for="bio">Biografia:</label><br>
            <textarea id="bio" name="biografia_usuario" rows="5" cols="40"></textarea>
        </div>

        <div>
            <input type="checkbox" id="termos" name="aceitou_termos" required>
            <label for="termos">Li e aceito os termos de uso</label>
        </div>

        <div>
            <button type="submit">Cadastrar</button>
        </div>
    </form>


    <script>
        /*
        $(document).ready(function () {
            //$('[name=nome]').mask('xx/xx/xxxx');
        });
        */
        // 1. Pega todos os botões de rádio com o nome 'genero'
        const radiosGenero = document.querySelectorAll('input[name="genero"]');

        // 2. Pega o container do campo de texto "Outro"
        const campoOutro = document.getElementById('campo_outro_genero');

        // 3. Pega o radio "Outro" especificamente
        const radioOutro = document.getElementById('gen_o');

        // 4. Adiciona um "ouvinte" para cada botão de rádio
        radiosGenero.forEach(radio => {
            radio.addEventListener('change', () => {
                // Esta função roda toda vez que uma opção é 'mudada'

                // 5. Verifica se o radio "Outro" está marcado
                if (radioOutro.checked) {
                    // Se sim, mostra o campo de texto
                    campoOutro.style.display = 'block';
                } else {
                    // Se não (qualquer outro foi clicado), esconde o campo
                    campoOutro.style.display = 'none';
                    //document.getElementById("genero_outro_texto").value = '';
                }
            });
        });
    </script>
</body>

</html>
