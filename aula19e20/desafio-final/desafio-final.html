<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafio Final - Perfil</title>
  <link rel="stylesheet" href="style.css"> 
</head>
<body>

  <header>
    <h1>Meu Perfil</h1>
  </header>

  <main class="container-principal">

    <article>
      <h2>Sobre Mim</h2>

      <iframe width="100%" height="315" src="https://www.youtube.com/embed/jfKfPfyJRdk" 
              title="YouTube video player" frameborder="0"></iframe>

      <h3>Minha Música Favorita:</h3>
      <audio controls src="minha_musica.mp3"></audio>

      <form action="#" method="get">
        <h3>Contato</h3>
        <div>
          <label for="email">Seu Email:</label>
          <input type="email" id="email" name="email_contato" required>
        </div>
        <div>
          <label for="msg">Mensagem:</label><br>
          <textarea id="msg" name="mensagem" rows="4"></textarea>
        </div>
        <button type="submit">Enviar</button>
      </form>
    </article>

    <aside>
      <h3>Status Atual</h3>
      <p>O que você está pensando?</p>

      <input type="text" id="status-input" placeholder="Meu status...">

      <button id="salvar-status">Salvar Status</button>
    </aside>

  </main> <footer>
    <p>&copy; 2025 - Minha Página de Perfil.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
